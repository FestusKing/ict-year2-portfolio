<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrej König — ICT Year 2 Portfolio</title>

  <!-- Google Font: eine klare, gut lesbare Schrift -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">Andrej König</h1>
      <p class="site-subtitle">ICT-Fachmann EFZ · Year 2 Portfolio · TBZ Zürich</p>
    </div>
  </header>

  <!-- ===== HAUPTBEREICH ===== -->
  <main>

    <!-- Liste aller Einträge (wird per JavaScript gefüllt) -->
    <section id="entry-list" class="entry-list" aria-label="Portfolio Einträge">
      <!-- Hier fügt script.js die Einträge automatisch ein -->
    </section>

    <!-- Detailansicht: zeigt einen einzelnen Eintrag vollständig an -->
    <section id="entry-detail" class="entry-detail hidden" aria-label="Eintrag Detail">
      <button id="back-button" class="back-button">← Zurück zur Übersicht</button>
      <div id="entry-detail-content"></div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <p>TBZ Zürich · ICT English · Portfolio Year 2 (2026/27)</p>
  </footer>

  <!-- Reihenfolge wichtig: erst die Daten (entries.js), dann die Logik (script.js) -->
  <script src="entries.js"></script>
  <script src="script.js"></script>
</body>
</html>
